# 수동 수집: 학교 게시판에서 새 공지를 받아 화면용 events.json까지 다시 만들고 main에 커밋한다.
# - 자동(예약)으로 돌지 않는다. Actions 화면에서 "Run workflow"를 눌렀을 때만 돈다.
# - 하는 일: tools/pipeline.py refresh (수집 live → 추출 → 이벤트 빌드) → 바뀐 데이터 파일 커밋 → 푸시
# - "커밋" 입력을 끄면 무엇이 바뀌는지만 로그에 보여 주고 커밋하지 않는다 (시험용).
# - 수집이 실패하면 아무것도 커밋하지 않는다.
# - 저장소가 읽기 전용이 되면(제출 마감 뒤) 푸시 단계에서 실패한다. 그때는 데이터가 바뀌지 않을 뿐이다.
name: 장학금 공지 수집 (수동)

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 결과를 main에 커밋한다 (끄면 바뀌는 내용만 보여 준다)
        type: boolean
        default: true

# 푸시하려면 쓰기 권한이 필요하다.
permissions:
  contents: write

# 두 번 눌러도 한 번에 하나만 돈다.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul  # 수집 기간(최근 N일)을 한국 날짜로 계산한다
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: 의존성 설치
        run: uv sync --locked

      - name: 수집 → 추출 → 이벤트 빌드
        run: uv run python tools/pipeline.py refresh

      - name: 바뀐 내용 보기
        run: |
          git add data/raw data/extracted web/public/events.json
          git diff --cached --stat | tail -n 30

      - name: 커밋하고 푸시
        if: ${{ inputs.commit }}
        run: |
          if git diff --cached --quiet; then
            echo "바뀐 내용이 없어 커밋하지 않는다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "build(data): 수동 수집 결과 반영 ($(date '+%Y-%m-%d %H:%M') KST)"
          git pull --rebase
          git push
